[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "littlelm"
version = "0.1.0"
description = "A small language model implementation from scratch in NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
gpu = [
    "cupy-cuda12x",
]

[tool.setuptools.packages.find]
where = ["src"]
